name: Auditoría SEO/GEO

on:
  push:
    branches: [main]
  schedule:
    # Todos los lunes a las 9:00 (hora Argentina, UTC-3)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      has_errors: ${{ steps.audit.outputs.exit_code != '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar auditoría SEO/GEO
        id: audit
        run: |
          set +e
          node scripts/seo-audit.mjs --report seo-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Guardar reporte
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report.md

      - name: Publicar reporte como issue (solo si hay errores)
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('seo-report.md', 'utf8');
            const title = '🔍 Auditoría SEO/GEO: errores detectados';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Marcar el build como fallido si hay errores
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "La auditoría encontró errores de SEO. Ver seo-report.md en los artifacts."
          exit 1
