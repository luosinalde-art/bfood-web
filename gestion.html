/* ===============  13 bis. IMPORTADOR DEL EMBUDO (CSV)  ===================
   Lee la planilla de seguimiento tal como se exporta, sin tocar sus columnas. */

/* Un CSV con comillas y comas dentro de los campos (los motivos de rechazo las tienen). */
function parsearCSV(texto){
  const filas = [];
  let fila = [], campo = '', enComillas = false;
  texto = texto.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  for(let i = 0; i < texto.length; i++){
    const c = texto[i];
    if(enComillas){
      if(c === '"'){
        if(texto[i+1] === '"'){ campo += '"'; i++; }
        else enComillas = false;
      } else campo += c;
    }else if(c === '"') enComillas = true;
    else if(c === ','){ fila.push(campo); campo = ''; }
    else if(c === '\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
    else campo += c;
  }
  if(campo !== '' || fila.length){ fila.push(campo); filas.push(fila); }
  if(!filas.length) return [];
  const encabezados = filas[0].map(h => h.trim());
  return filas.slice(1)
    .filter(f => f.some(v => (v||'').trim()))
    .map(f => { const o = {}; encabezados.forEach((h,i) => o[h] = (f[i]||'').trim()); return o; });
}

/* "1/01/2026" → "2026-01-01" */
function fechaDeCSV(v){
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((v||'').trim());
  if(!m) return '';
  return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
}
/* "$1.050.000" → 1050000 · "$285,71" → 285.71 · "#N/A" → null */
function montoDeCSV(v){
  let s = (v||'').replace(/\$|\s|"/g, '').trim();
  if(!s || s === '#N/A' || s === '-') return null;
  const negativo = s.startsWith('-');
  s = s.replace('-','');
  s = /,\d{1,2}$/.test(s) ? s.replace(/\./g,'').replace(',','.') : s.replace(/[.,]/g,'');
  const n = Number(s);
  return isNaN(n) ? null : (negativo ? -n : n);
}
function porcentajeDeCSV(v){
  const s = (v||'').replace('%','').trim();
  if(!s) return '';
  const n = Number(s.replace(',','.'));
  return isNaN(n) ? '' : (n <= 1 && s.indexOf('.') >= 0 ? n*100 : n);
}

/* "9- Perdido" → clave interna. Acepta el número, el texto o ambos. */
function estadoDeCSV(v){
  const s = (v||'').trim().toLowerCase();
  if(!s) return 'primer_contacto';
  const numero = (s.match(/^(\d)/) || [])[1];
  const porNumero = {'0':'primer_contacto','1':'discovery','2':'no_califica','3':'alianza',
                     '4':'presupuesto_enviado','5':'verbal','6':'verbal','7':'ganado',
                     '8':'no_contesto','9':'perdido'};
  if(numero && porNumero[numero]) return porNumero[numero];
  if(s.includes('gana') || s.includes('aprob')) return 'ganado';
  if(s.includes('perd')) return 'perdido';
  if(s.includes('no contesta') || s.includes('no contesto')) return 'no_contesto';
  if(s.includes('califica')) return 'no_califica';
  if(s.includes('alianza')) return 'alianza';
  if(s.includes('verbal')) return 'verbal';
  if(s.includes('presupuesto')) return 'presupuesto_enviado';
  if(s.includes('discovery')) return 'discovery';
  return 'primer_contacto';
}

/* Unifica las variantes de fuente sin perder el texto original. */
function fuenteDeCSV(v){
  const bruto = (v||'').trim();
  if(!bruto) return {fuente:'', detalle:''};
  const s = bruto.toLowerCase();
  const detalle = bruto;
  if(s.startsWith('referido')) return {fuente:'Referido', detalle};
  if(s.includes('referido'))   return {fuente:'Referido', detalle};
  if(s === 'web')              return {fuente:'Web', detalle:''};
  if(s === 'linkedin')         return {fuente:'LinkedIn', detalle:''};
  if(s === 'whatsapp')         return {fuente:'WhatsApp', detalle:''};
  if(s === 'instagram')        return {fuente:'Instagram', detalle:''};
  if(s === 'cliente')          return {fuente:'Cliente actual', detalle:''};
  if(s === 'contacto')         return {fuente:'Contacto', detalle:''};
  if(s === 'cas')              return {fuente:'CAS', detalle:''};
  if(s === 'networking')       return {fuente:'Networking', detalle:''};
  if(s === 'ditella')          return {fuente:'Ditella', detalle:''};
  if(s.startsWith('contacto')) return {fuente:'Contacto', detalle};
  return {fuente:'Otra', detalle};
}

/* Clave anti-duplicados. Incluye servicio y categoría porque en la planilla hay
   filas del mismo cliente en la misma fecha por dos servicios distintos. */
const claveLead = l => [(l.nombre||'').trim().toLowerCase(), l.fechaContacto||'',
  (l.servicio||'').trim().toLowerCase(), (l.categoria||'').trim().toLowerCase()].join('|');

/* Convierte las filas del CSV en leads, sin tocar la base todavía. */
function leerEmbudoCSV(texto){
  const filas = parsearCSV(texto);
  const col = (f, ...nombres) => {
    for(const n of nombres) if(f[n] !== undefined && f[n] !== '') return f[n];
    return '';
  };
  const leidos = [], problemas = [];
  filas.forEach((f, i) => {
    const nombre = col(f,'Cliente','cliente','Nombre').trim();
    const fechaContacto = fechaDeCSV(col(f,'Fecha Contacto','Fecha contacto','Fecha'));
    if(!nombre){ problemas.push({fila:i+2, motivo:'sin nombre de cliente'}); return; }
    if(!fechaContacto){ problemas.push({fila:i+2, motivo:'fecha de contacto ilegible', nombre}); return; }
    const fu = fuenteDeCSV(col(f,'Fuente','Origen'));
    const monto = montoDeCSV(col(f,'Monto'));
    leidos.push({
      id:uid(), notas:[],
      nombre, empresa:'',
      fuente:fu.fuente, fuenteDetalle:fu.detalle,
      servicio:col(f,'Servicio'), categoria:col(f,'Categoria','Categoría'),
      estado:estadoDeCSV(col(f,'Estado')),
      moneda:(col(f,'Moneda') || 'ARS').toUpperCase(),
      monto: monto === null ? 0 : monto,
      cotizacionUSD: montoDeCSV(col(f,'Cotización USD','Cotizacion USD')) || DB.config.cotizacionUSD,
      probabilidad: porcentajeDeCSV(col(f,'% probabilidad','Probabilidad')),
      fechaContacto,
      fechaPresupuesto: fechaDeCSV(col(f,'Fecha de Presupuesto')),
      proximoSeguimiento: fechaDeCSV(col(f,'Fecha Proximo Contacto','Fecha Próximo Contacto')),
      fechaCierre: fechaDeCSV(col(f,'Fecha de Cierre')),
      fechaEstimadaInicio: col(f,'Fecha estimada inicio'),
      motivo: col(f,'Motivo de Rechazo','Motivo'),
      horasEstimadas: col(f,'Horas estimadas')
    });
  });
  return {leidos, problemas};
}

function mostrarPrevia(texto){
  const {leidos, problemas} = leerEmbudoCSV(texto);

  }

  const nuevos = leidos.filter(l => !existentes.has(claveLead(l)));
  const repetidos = leidos.length - nuevos.length;
  const ganados = nuevos.filter(l => l.estado === 'ganado');

      </div>` : ''}
      ${problemas.length ? `<div class="aviso warn" style="margin-bottom:.7rem">
        Filas que se van a saltear: ${problemas.slice(0,5).map(p => `fila ${p.fila} (${esc(p.motivo)})`).join(', ')}${problemas.length>5?` y ${problemas.length-5} más`:''}.
      </div>` : ''}
      ${repetidos ? `<label style="font-size:.85rem;display:flex;gap:.45rem;align-items:center;margin-bottom:.5rem">
        <input type="checkbox" id="imp-actualizar"/> Actualizar las ${repetidos} que ya estaban (por defecto se dejan como están)</label>` : ''}
      ${ganados.length ? `<label style="font-size:.85rem;display:flex;gap:.45rem;align-items:center">
        <input type="checkbox" id="imp-ganados" checked/> Dar de alta los ${ganados.length} ganados: cliente, proyecto y factura por el total</label>` : ''}
    </div>`;

  document.getElementById('modal-pie').innerHTML = `
    <button class="btn" onclick="cerrarModal()">Cancelar</button>
    <button class="btn pri" onclick="confirmarImporte()" ${nuevos.length||repetidos?'':'disabled'}>Importar</button>`;
}

function confirmarImporte(){
  if(!importePendiente) return;
  const actualizar = !!(document.getElementById('imp-actualizar') || {}).checked;
  const altaGanados = !!(document.getElementById('imp-ganados') || {}).checked;
  // El mapa se arma una sola vez, con lo que ya había: dos filas iguales dentro
  // del mismo archivo son dos oportunidades distintas y entran las dos.
  const porClave = new Map(DB.leads.map(l => [claveLead(l), l]));
  let nuevos = 0, actualizados = 0, altas = 0;

  importePendiente.forEach(l => {
    const existente = porClave.get(claveLead(l));
    let lead;
    if(existente){
      if(!actualizar) return;
      const {id, notas, clienteId} = existente;
      Object.assign(existente, l, {id, notas, clienteId});
      lead = existente;
      actualizados++;
    }else{
      DB.leads.push(l);
      lead = l;
      nuevos++;
    }
    if(altaGanados && lead.estado === 'ganado' && !lead.clienteId){
      if(altaDesdeLead(lead)) altas++;
    }
  });

  guardar();
  importePendiente = null;
  cerrarModal();
  ir('leads');
  toast(`Importados ${nuevos} leads${actualizados?', '+actualizados+' actualizados':''}${altas?', '+altas+' clientes dados de alta':''}.`);
}

/* Crea cliente + proyecto + factura a partir de un lead ganado. */
function altaDesdeLead(lead){
  if(!num(lead.monto)) return false;
  const cliente = {
    id:uid(), razonSocial:lead.nombre, nombreFantasia:lead.empresa || lead.nombre,
    cuit:'', contacto:'', telefono:lead.telefono||'', email:lead.email||'',
    rne:'', domicilio:'', rubro:lead.rubro||'',
    fechaAlta:lead.fechaCierre || lead.fechaContacto || hoy(), leadId:lead.id, notas:[]
  };
  DB.clientes.push(cliente);

  const mensual = esMensual(lead);
  const inicio = lead.fechaCierre || lead.fechaContacto || hoy();
  const proyecto = {
    id:uid(), clienteId:cliente.id, presupuestoId:null,
    nombre:[lead.servicio, lead.categoria].filter(Boolean).join(' · ') || 'Proyecto',
    servicioId:servicioDeEmbudo(lead.servicio, lead.categoria),
    estado:'activo', fechaInicio:inicio, moneda:lead.moneda || 'ARS',
    montoTotal:num(lead.monto), recurrente:mensual,
    honorarioMensual: mensual ? num(lead.monto) : 0,
    diaFacturacion: mensual ? 1 : 0,
    proximoAjuste: mensual ? sumarMeses(mesDe(inicio), 3) + '-01' : '',
    ultimoMesGenerado:''
  };
  DB.proyectos.push(proyecto);

  DB.facturas.push({
    id:uid(), clienteId:cliente.id, proyectoId:proyecto.id,
    concepto: mensual ? 'Abono ' + etiquetaMes(mesDe(inicio)) : 'Total del servicio',
    mesServicio: mensual ? mesDe(inicio) : undefined,
    moneda:lead.moneda || 'ARS', monto:num(lead.monto), pct:100,
    estado:'por_emitir', numero:'', fechaEmision:'', vencimiento:'', fechaCobro:''
  });

  lead.clienteId = cliente.id;
  return true;
}

        <tbody>
          ${(p.fases||[]).map(f => `<tr>
            <td>${esc(f.nombre)}</td><td class="num">${num(f.hsMin)}</td><td class="num">${num(f.hsMax)}</td>
            <td class="num">${fmt(num(f.hsMin)*num(p.tarifaHora), p.moneda)} – ${fmt(num(f.hsMax)*num(p.tarifaHora), p.moneda)}</td>
          </tr>`).join('')}
          <tr class="total"><td>Total del proyecto</td>
            <td class="num">${horasPresupuesto(p).min}</td><td class="num">${horasPresupuesto(p).max}</td>
            <td class="num">${fmt(t.min,p.moneda)} – ${fmt(t.max,p.moneda)}</td></tr>
        </tbody>
      </table>
      <p style="font-size:.82rem;color:#666">Tarifa por hora profesional: ${fmt(p.tarifaHora, p.moneda)}. Las horas por fase son estimadas.</p>
    ` : `
      <table>
        <thead><tr><th>Concepto</th><th>Detalle</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Subtotal</th></tr></thead>
        <tbody>
          ${(p.items||[]).map(i => `<tr>
            <td><b>${esc(i.concepto)}</b></td><td>${esc(i.detalle||'')}</td>
            <td class="num">${num(i.cantidad||1)}</td><td class="num">${fmt(i.precioUnit, p.moneda)}</td>
            <td class="num">${fmt(num(i.cantidad||1)*num(i.precioUnit), p.moneda)}</td>
          </tr>`).join('')}
          <tr class="total"><td colspan="4">Total de honorarios</td><td class="num">${fmt(t.total, p.moneda)}</td></tr>
        </tbody>
      </table>
    `}

    ${(p.aranceles||[]).length ? `<h3>Aranceles oficiales</h3>
      <table>
        <thead><tr><th>Concepto</th><th class="num">Monto</th></tr></thead>
        <tbody>${p.aranceles.map(a => `<tr><td>${esc(a.concepto)}</td><td class="num">${a.monto?fmt(a.monto,p.moneda):'Según organismo'}</td></tr>`).join('')}
        ${ar ? `<tr class="total"><td>Total de aranceles</td><td class="num">${fmt(ar, p.moneda)}</td></tr>` : ''}</tbody>
      </table>
      <p style="font-size:.82rem;color:#666">Los aranceles corresponden a tasas oficiales, no están incluidos en los honorarios y pueden actualizarse según disposiciones del organismo.</p>` : ''}

    ${(p.hitos||[]).length ? `<h2>Forma de pago</h2>
      <table>
        <thead><tr><th style="width:22%">Hito</th><th>Cuándo se factura</th><th class="num" style="width:10%">%</th><th class="num" style="width:22%">Importe</th></tr></thead>
        <tbody>${p.hitos.map(h => `<tr>
          <td><b>${esc(h.nombre)}</b></td><td>${esc(h.condicion||'')}</td>
          <td class="num">${num(h.pct)}%</td><td class="num">${fmt(t.total*num(h.pct)/100, p.moneda)}</td>
        </tr>`).join('')}</tbody>
      </table>` : ''}
    ${p.condicionesPago ? lineas(p.condicionesPago).map(l => `<p>${esc(l)}</p>`).join('') : ''}

    ${(p.exclusiones||[]).length || (p.requisitos||[]).length ? `<h2>Alcance detallado</h2>
      <div class="dos-col">
        ${(p.requisitos||[]).length ? `<div class="caja"><h3>Documentación requerida</h3>
          <ul>${p.requisitos.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
        ${(p.exclusiones||[]).length ? `<div class="caja no"><h3>No incluye</h3>
          <ul>${p.exclusiones.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
      </div>` : ''}

    ${p.plazos ? `<h2>Plazos de ejecución</h2>${lineas(p.plazos).map(l => `<p>${esc(l)}</p>`).join('')}` : ''}
    ${p.notas ? `<h2>Condiciones generales</h2>${lineas(p.notas).map(l => `<p>${esc(l)}</p>`).join('')}` : ''}

    <div class="firma">
      <div>Firma y aclaración — ${esc(p.clienteNombre||'Cliente')}</div>
      <div>${esc(c.profesional)}${c.matricula?' — '+esc(c.matricula):''}</div>
    </div>

    <div class="pie-doc">
      BFood Consultoría Alimentaria · ${esc(c.email)} · ${esc(c.telefono)} · ${esc(c.web)}<br/>
      Propuesta ${esc(p.numero)} ${esc(p.version)} — válida por ${num(p.validezDias)} días desde su emisión.
    </div>
  </div>`;
}

/* =======================  15. ARRANQUE  ================================== */

window.addEventListener('hashchange', router);
document.getElementById('velo').addEventListener('click', e => { if(e.target.id === 'velo') cerrarModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') cerrarModal();
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.getElementById('velo').classList.contains('abierto')) guardarModal();
});

cargarDB();
if(!location.hash) location.hash = '#/panel';
router();
</script>
</body>
</html>
