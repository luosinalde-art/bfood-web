<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>BFood · Gestión</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#209d5c;--gd:#167a47;--gdp:#0d5230;--gl:#d8f3e5;--gll:#f0faf4;
  --gris:#555;--gris2:#6f6f6f;--tx:#3a3a3a;--wh:#fff;--ow:#f7faf9;
  --bd:#e3ebe7;--bd2:#cfdcd6;
  --rojo:#c0392b;--rojoL:#fdeceb;--ambar:#b06f14;--ambarL:#fdf3e2;
  --azul:#2b6cb0;--azulL:#eaf1f9;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;color:var(--tx);background:var(--ow);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:600;line-height:1.2;color:#272525}
a{color:var(--gd);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--g)}

/* ================= LAYOUT ================= */
#app{display:flex;min-height:100vh}
#lateral{
  width:232px;flex:0 0 232px;background:#3b3b3b;color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
#lateral .marca{padding:1.15rem 1.2rem 1rem;border-bottom:1px solid rgba(255,255,255,.1)}
#lateral .marca b{font-family:var(--serif);font-size:1.85rem;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
#lateral .marca b span{color:var(--g)}
#lateral .marca small{font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.4);display:block;margin-top:.3rem}
#lateral nav{padding:.7rem 0;flex:1;overflow-y:auto}
#lateral nav a{
  display:flex;align-items:center;gap:.6rem;padding:.55rem 1.2rem;
  color:rgba(255,255,255,.72);font-size:.9rem;border-left:3px solid transparent;
}
#lateral nav a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
#lateral nav a.on{background:rgba(32,157,92,.16);color:#fff;border-left-color:var(--g);font-weight:600}
#lateral nav a .ic{width:1.1rem;text-align:center;font-size:.95rem;opacity:.9}
#lateral nav a .cnt{
  margin-left:auto;background:rgba(255,255,255,.14);border-radius:9px;
  padding:.02rem .38rem;font-size:.7rem;font-weight:600;
}
#lateral nav a.on .cnt{background:var(--g)}
#lateral nav .sep{
  padding:.9rem 1.2rem .3rem;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.32);font-weight:600;
}
#lateral .pie{padding:.8rem 1.2rem;border-top:1px solid rgba(255,255,255,.1);font-size:.72rem;color:rgba(255,255,255,.42)}

#principal{flex:1;min-width:0;padding:1.5rem 1.9rem 4rem}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.cab h1{font-size:1.55rem;letter-spacing:-.01em}
.cab p.sub{color:var(--gris2);font-size:.88rem;margin-top:.15rem}
.cab .acciones{display:flex;gap:.5rem;flex-wrap:wrap}

/* ================= COMPONENTES ================= */
.tarjeta{background:var(--wh);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sombra)}
.tarjeta+.tarjeta{margin-top:1.1rem}
.tarjeta>h2{
  font-size:.95rem;padding:.8rem 1.1rem;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:.5rem;justify-content:space-between;
}
.tarjeta>h2 .der{display:flex;gap:.45rem;align-items:center}
.tarjeta .cuerpo{padding:1.1rem}
.tarjeta .cuerpo.sinpad{padding:0}

.btn{
  display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--bd2);
  background:var(--wh);color:var(--tx);border-radius:7px;padding:.42rem .8rem;
  font-size:.85rem;font-weight:500;cursor:pointer;transition:.14s;white-space:nowrap;
}
.btn:hover{border-color:var(--g);color:var(--gd);background:var(--gll)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.pri:hover{background:var(--gd);border-color:var(--gd);color:#fff}
.btn.peligro{color:var(--rojo);border-color:#e9c4c0}
.btn.peligro:hover{background:var(--rojoL);border-color:var(--rojo);color:var(--rojo)}
.btn.mini{padding:.22rem .5rem;font-size:.78rem;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-txt{background:none;border:none;color:var(--gd);cursor:pointer;font-size:.82rem;padding:.15rem .3rem;border-radius:5px}
.btn-txt:hover{background:var(--gll);text-decoration:underline}
.btn-txt.peligro{color:var(--rojo)}
.btn-txt.peligro:hover{background:var(--rojoL)}

.chip{
  display:inline-block;padding:.13rem .52rem;border-radius:20px;font-size:.72rem;
  font-weight:600;letter-spacing:.01em;white-space:nowrap;border:1px solid transparent;
}
.chip.gris{background:#eef1f0;color:#5c6664;border-color:#e0e5e3}
.chip.verde{background:var(--gl);color:var(--gdp);border-color:#bde6d1}
.chip.azul{background:var(--azulL);color:var(--azul);border-color:#cfe0f1}
.chip.ambar{background:var(--ambarL);color:var(--ambar);border-color:#f3e0bf}
.chip.rojo{background:var(--rojoL);color:var(--rojo);border-color:#f3cfcb}
.chip.lila{background:#f1ecfa;color:#6b4bab;border-color:#ded2f3}

table.tab{width:100%;border-collapse:collapse;font-size:.87rem}
table.tab th{
  text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris2);font-weight:600;padding:.6rem 1.1rem;border-bottom:1px solid var(--bd);
  background:#fbfdfc;white-space:nowrap;
}
table.tab td{padding:.62rem 1.1rem;border-bottom:1px solid #f0f4f2;vertical-align:middle}
table.tab tr:last-child td{border-bottom:none}
table.tab tbody tr:hover{background:var(--gll)}
table.tab td.num,table.tab th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tab td.acc{text-align:right;white-space:nowrap}
table.tab .prin{font-weight:600;color:#272525}
table.tab .sec{color:var(--gris2);font-size:.79rem}

.vacio{padding:2.4rem 1.1rem;text-align:center;color:var(--gris2)}
.vacio .em{font-size:1.8rem;display:block;margin-bottom:.5rem;opacity:.5}
.vacio p{font-size:.88rem;margin-bottom:.9rem}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.85rem;margin-bottom:1.1rem}
.kpi{background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:.9rem 1rem;box-shadow:var(--sombra)}
.kpi .et{font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gris2);font-weight:600}
.kpi .val{font-size:1.5rem;font-weight:600;color:#272525;margin-top:.28rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val.chico{font-size:1.2rem}
.kpi .pie2{font-size:.76rem;color:var(--gris2);margin-top:.25rem}
.kpi.alerta{border-color:#f0cdc8;background:#fffbfb}
.kpi.alerta .val{color:var(--rojo)}
.kpi.neutro .val{color:#272525}
.kpi.ok .val{color:var(--gd)}

.grilla2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1.1rem;align-items:start}
.grilla2>.tarjeta+.tarjeta{margin-top:0}

/* ---- formularios ---- */
.campo{margin-bottom:.85rem}
.campo>label{display:block;font-size:.78rem;font-weight:600;color:#4a4a4a;margin-bottom:.22rem}
.campo>label .op{font-weight:400;color:var(--gris2)}
.campo input[type=text],.campo input[type=date],.campo input[type=number],
.campo input[type=email],.campo input[type=month],.campo select,.campo textarea{
  width:100%;border:1px solid var(--bd2);border-radius:7px;padding:.44rem .6rem;
  background:var(--wh);transition:.12s;font-size:.88rem;
}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(32,157,92,.13)
}
.campo textarea{resize:vertical;min-height:64px;line-height:1.45}
.campo .ayuda{font-size:.74rem;color:var(--gris2);margin-top:.2rem}
.fila{display:grid;gap:.85rem}
.fila.c2{grid-template-columns:1fr 1fr}
.fila.c3{grid-template-columns:1fr 1fr 1fr}
.fila.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.fila.c2,.fila.c3,.fila.c4{grid-template-columns:1fr}}
fieldset{border:none}
.seccion-form{border-top:1px solid var(--bd);margin-top:1.2rem;padding-top:1.1rem}
.seccion-form>h3{
  font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--g);
  margin-bottom:.7rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}

/* filas dinámicas (entregables, fases, ítems, hitos) */
.lista-din{display:flex;flex-direction:column;gap:.5rem}
.item-din{
  display:grid;gap:.5rem;align-items:start;background:#fbfdfc;
  border:1px solid var(--bd);border-radius:8px;padding:.6rem;
}
.item-din .quitar{
  background:none;border:none;color:var(--gris2);cursor:pointer;font-size:1rem;
  line-height:1;padding:.3rem;border-radius:5px;align-self:center;
}
.item-din .quitar:hover{background:var(--rojoL);color:var(--rojo)}
.item-din input,.item-din textarea{
  width:100%;border:1px solid var(--bd2);border-radius:6px;padding:.34rem .5rem;font-size:.84rem;background:#fff;
}
.item-din input:focus,.item-din textarea:focus{outline:none;border-color:var(--g)}
.item-din textarea{resize:vertical;min-height:38px}
.item-din .lin{display:grid;gap:.5rem}
.item-din .n{
  font-size:.74rem;font-weight:700;color:var(--g);background:var(--gl);
  border-radius:5px;padding:.2rem .4rem;align-self:center;min-width:1.5rem;text-align:center;
}

/* ---- modal ---- */
#velo{
  position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:900;
  display:none;align-items:flex-start;justify-content:center;padding:2.5vh 1rem;overflow-y:auto;
}
#velo.abierto{display:flex}
#modal{
  background:var(--wh);border-radius:12px;width:100%;max-width:660px;
  box-shadow:0 18px 50px rgba(0,0,0,.24);margin:auto;
}
#modal.ancho{max-width:1000px}
#modal>header{
  padding:.95rem 1.2rem;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  position:sticky;top:0;background:var(--wh);border-radius:12px 12px 0 0;z-index:2;
}
#modal>header h2{font-size:1.05rem}
#modal>header .cerrar{background:none;border:none;font-size:1.4rem;line-height:1;color:var(--gris2);cursor:pointer;padding:.1rem .4rem;border-radius:6px}
#modal>header .cerrar:hover{background:#f1f4f3;color:var(--tx)}
#modal>.contenido{padding:1.2rem}
#modal>footer{
  padding:.85rem 1.2rem;border-top:1px solid var(--bd);display:flex;
  justify-content:flex-end;gap:.55rem;position:sticky;bottom:0;background:var(--wh);
  border-radius:0 0 12px 12px;flex-wrap:wrap;
}
#modal>footer .izq{margin-right:auto}

/* ---- avisos ---- */
.aviso{border-radius:8px;padding:.65rem .85rem;font-size:.84rem;border:1px solid;line-height:1.45}
.aviso.info{background:var(--azulL);border-color:#cfe0f1;color:#22588f}
.aviso.ok{background:var(--gll);border-color:#bde6d1;color:var(--gdp)}
.aviso.warn{background:var(--ambarL);border-color:#f3e0bf;color:var(--ambar)}
.aviso.err{background:var(--rojoL);border-color:#f3cfcb;color:var(--rojo)}
.aviso+.aviso,.aviso+.tarjeta,.tarjeta+.aviso{margin-top:1.1rem}
.aviso b{font-weight:600}

#toast{
  position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(140%);
  background:#2c3a34;color:#fff;padding:.7rem 1.15rem;border-radius:8px;font-size:.87rem;
  box-shadow:0 8px 26px rgba(0,0,0,.28);z-index:2000;transition:transform .26s;max-width:90vw;
}
#toast.ver{transform:translateX(-50%) translateY(0)}

.filtros{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.filtros input[type=text],.filtros select,.filtros input[type=month]{
  border:1px solid var(--bd2);border-radius:7px;padding:.36rem .6rem;background:var(--wh);font-size:.85rem;
}
.filtros input[type=text]{min-width:200px}
.filtros input:focus,.filtros select:focus{outline:none;border-color:var(--g)}
.filtros .esp{margin-left:auto}

/* embudo de leads */
.embudo{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1rem}
.embudo button{
  border:1px solid var(--bd);background:var(--wh);border-radius:8px;padding:.45rem .7rem;
  cursor:pointer;text-align:left;flex:1 1 104px;max-width:200px;transition:.14s;
}
.embudo button:hover{border-color:var(--g)}
.embudo button.on{border-color:var(--g);background:var(--gll);box-shadow:inset 0 -2px 0 var(--g)}
.embudo button .e{display:block;font-size:.72rem;color:var(--gris2);font-weight:600;line-height:1.25}
.embudo button .v{display:block;font-size:1.15rem;font-weight:600;color:#272525;margin-top:.1rem}
.embudo button .e:last-child{color:var(--gd);font-weight:600;font-size:.7rem}

/* checklist de tareas */
.grupo-cliente{border-bottom:1px solid var(--bd)}
.grupo-cliente:last-child{border-bottom:none}
.grupo-cliente>h3{
  padding:.6rem 1.1rem;background:#fbfdfc;font-size:.87rem;display:flex;
  align-items:center;justify-content:space-between;gap:.6rem;border-bottom:1px solid var(--bd);
}
.grupo-cliente>h3 .proy{font-weight:400;color:var(--gris2);font-size:.79rem}
.tarea{display:flex;gap:.7rem;padding:.55rem 1.1rem;border-bottom:1px solid #f2f6f4;align-items:flex-start}
.tarea:last-child{border-bottom:none}
.tarea:hover{background:var(--gll)}
.tarea input[type=checkbox]{margin-top:.25rem;width:16px;height:16px;accent-color:var(--g);cursor:pointer;flex:0 0 auto}
.tarea .cont{flex:1;min-width:0}
.tarea .tit{font-weight:500;font-size:.89rem}
.tarea .meta{font-size:.76rem;color:var(--gris2);margin-top:.12rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tarea.hecha .tit{text-decoration:line-through;color:var(--gris2);font-weight:400}
.tarea .der{display:flex;gap:.3rem;align-items:center;flex:0 0 auto}
.vence-hoy{color:var(--ambar);font-weight:600}
.vencida{color:var(--rojo);font-weight:600}

/* barra de progreso */
.barra{height:6px;background:#eef2f0;border-radius:4px;overflow:hidden;min-width:70px}
.barra>i{display:block;height:100%;background:var(--g);border-radius:4px}

/* detalle */
.dato{display:flex;gap:.5rem;padding:.32rem 0;font-size:.86rem;border-bottom:1px dashed #eef2f0}
.dato:last-child{border-bottom:none}
.dato .k{color:var(--gris2);min-width:150px;flex:0 0 auto}
.dato .v{font-weight:500}
.lista-simple{list-style:none;font-size:.86rem}
.lista-simple li{padding:.3rem 0 .3rem 1rem;position:relative;border-bottom:1px dashed #eef2f0}
.lista-simple li:last-child{border-bottom:none}
.lista-simple li::before{content:'·';position:absolute;left:.25rem;color:var(--g);font-weight:700}
.nota{background:#fbfdfc;border-left:3px solid var(--gl);padding:.45rem .7rem;border-radius:0 6px 6px 0;margin-bottom:.45rem;font-size:.85rem}
.nota .f{font-size:.74rem;color:var(--gris2);font-weight:600;margin-bottom:.1rem}
.pest{display:flex;gap:.2rem;border-bottom:1px solid var(--bd);margin-bottom:1.1rem;flex-wrap:wrap}
.pest button{
  background:none;border:none;border-bottom:2px solid transparent;padding:.5rem .8rem;
  cursor:pointer;font-size:.87rem;color:var(--gris2);font-weight:500;margin-bottom:-1px;
}
.pest button:hover{color:var(--gd)}
.pest button.on{color:var(--gd);border-bottom-color:var(--g);font-weight:600}
.mono{font-variant-numeric:tabular-nums}
.tot-linea{display:flex;justify-content:space-between;padding:.3rem 0;font-size:.87rem}
.tot-linea.grande{border-top:1px solid var(--bd);margin-top:.4rem;padding-top:.55rem;font-size:1rem;font-weight:600}
.tot-linea .v{font-variant-numeric:tabular-nums;font-weight:600}

/* ================= DOCUMENTO IMPRIMIBLE ================= */
#doc{display:none}
body.imprimiendo #app{display:none}
body.imprimiendo #doc{display:block}
.hoja{
  max-width:830px;margin:1.4rem auto;background:#fff;padding:2.6rem 3rem 3rem;
  box-shadow:0 4px 24px rgba(0,0,0,.1);font-size:13.5px;line-height:1.55;color:#333;
}
.hoja .barra-doc{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:3px solid var(--g);padding-bottom:.85rem;margin-bottom:1.6rem;gap:1rem;flex-wrap:wrap;
}
.hoja .barra-doc .m{font-family:var(--serif);font-size:2.5rem;font-weight:700;line-height:1;letter-spacing:-.02em;color:#3b3b3b}
.hoja .barra-doc .m span{color:var(--g)}
.hoja .barra-doc .m small{display:block;font-family:inherit;font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;color:#999;margin-top:.25rem;font-weight:500}
.hoja .barra-doc .der{text-align:right;font-size:.78rem;color:#666;line-height:1.6}
.hoja h1{font-family:var(--serif);font-size:2rem;color:var(--gdp);line-height:1.15;font-weight:700}
.hoja .bajada{font-size:1rem;color:var(--gris2);margin-top:.2rem;margin-bottom:1.4rem}
.hoja h2{
  font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;color:var(--g);
  margin:1.7rem 0 .6rem;padding-bottom:.28rem;border-bottom:1px solid var(--gl);font-weight:700;
}
.hoja h3{font-size:.95rem;margin:.9rem 0 .3rem;color:#272525}
.hoja p{margin-bottom:.6rem}
.hoja ul{margin:0 0 .7rem 1.1rem}
.hoja li{margin-bottom:.24rem}
.hoja .ficha{
  display:grid;grid-template-columns:auto 1fr;gap:.28rem 1.1rem;font-size:.86rem;
  background:#fafdfb;border:1px solid var(--gl);border-radius:8px;padding:.85rem 1.05rem;margin-bottom:1.2rem;
}
.hoja .ficha b{color:var(--gris2);font-weight:600}
.hoja table{width:100%;border-collapse:collapse;font-size:.85rem;margin:.5rem 0 .9rem}
.hoja table th{
  background:var(--gdp);color:#fff;text-align:left;padding:.48rem .7rem;font-size:.75rem;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600;
}
.hoja table td{padding:.45rem .7rem;border-bottom:1px solid #e8efec;vertical-align:top}
.hoja table tr:nth-child(even) td{background:#fbfdfc}
.hoja table td.num,.hoja table th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hoja table tr.total td{background:var(--gl);font-weight:700;color:var(--gdp);border-bottom:none;font-size:.92rem}
.hoja .dos-col{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.hoja .caja{border:1px solid var(--bd);border-radius:8px;padding:.8rem 1rem}
.hoja .caja h3{margin-top:0;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--g)}
.hoja .caja.no h3{color:var(--gris2)}
.hoja .planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin:.6rem 0 1rem}
.hoja .plan{border:1px solid var(--bd);border-radius:9px;padding:.9rem}
.hoja .plan.elegido{border-color:var(--g);border-width:2px;background:#fafdfb}
.hoja .plan .nom{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--g);font-weight:700}
.hoja .plan .pr{font-size:1.45rem;font-weight:700;color:var(--gdp);margin:.15rem 0 .5rem;font-variant-numeric:tabular-nums}
.hoja .plan ul{margin-left:1rem;font-size:.81rem}
.hoja .firma{margin-top:2.6rem;display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
.hoja .firma div{border-top:1px solid #bbb;padding-top:.4rem;font-size:.8rem;color:var(--gris2)}
.hoja .pie-doc{margin-top:2rem;padding-top:.8rem;border-top:1px solid var(--bd);font-size:.75rem;color:#8a8a8a;text-align:center;line-height:1.6}
.hoja .destacado{

function cargarDB(){
  try{

    if(!crudo){ DB = dbVacia(); guardar(); return; }
    DB = JSON.parse(crudo);
    completarClaves();
    migrar();
  }catch(e){
    console.error('No se pudo leer el almacenamiento local', e);
    DB = dbVacia();
  }
}

/* Completa las claves que falten, para que un respaldo viejo no rompa nada. */
function completarClaves(){
  const base = dbVacia();
  for(const k in base) if(DB[k] === undefined) DB[k] = base[k];
  for(const k in base.config) if(DB.config[k] === undefined) DB.config[k] = base.config[k];
}

/* v1 → v2: los estados de lead pasan a ser los del embudo de la planilla. */
const ESTADOS_V1_A_V2 = {
  nuevo:'primer_contacto', discovery_agendado:'discovery', discovery_hecho:'discovery',
  presupuesto_enviado:'presupuesto_enviado', negociacion:'verbal',
  aceptado:'ganado', rechazado:'perdido', frio:'no_contesto'
};
function migrar(){
  if(!DB.version || DB.version < 2){
    (DB.leads || []).forEach(l => {
      if(ESTADOS_V1_A_V2[l.estado]) l.estado = ESTADOS_V1_A_V2[l.estado];
      if(!l.fechaContacto) l.fechaContacto = l.fechaAlta || hoy();
      if(l.origen && !l.fuente){ l.fuente = l.origen; delete l.origen; }
    });
    DB.version = 2;
    guardar();
  }
}

function guardar(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DB));
  }catch(e){
    alert('No se pudieron guardar los datos: el almacenamiento del navegador está lleno o bloqueado.\n\nExportá un respaldo desde la pantalla Datos antes de seguir trabajando.');
  }
}

/* =======================  4. UTILIDADES  ================================= */

function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br/>'); }
function lineas(s){ return String(s||'').split('\n').map(x=>x.trim()).filter(Boolean); }

function hoy(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function mesHoy(){ return hoy().slice(0,7); }
function mesDe(f){ return f ? String(f).slice(0,7) : ''; }
function etiquetaMes(m){
  if(!m) return '';
  const [a,me] = m.split('-');
  return MESES[Number(me)-1] + ' ' + a;
}
function sumarMeses(m, n){
  const [a,me] = m.split('-').map(Number);
  const d = new Date(a, me-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function sumarDias(f, n){
  const d = new Date(f+'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtFecha(f){
  if(!f) return '—';
  const p = String(f).split('-');
  if(p.length < 3) return f;
  return p[2]+'/'+p[1]+'/'+p[0];
}
function fmtFechaLarga(f){
  if(!f) return '';
  const [a,m,d] = f.split('-');
  return Number(d)+' de '+MESES[Number(m)-1]+' de '+a;
}
function diasEntre(a, b){
  return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
}
function fmt(n, moneda){
  const v = Number(n)||0;
  try{
    return new Intl.NumberFormat('es-AR',{style:'currency',currency:moneda||'ARS',maximumFractionDigits:0}).format(v);
  }catch(e){
    return (moneda||'ARS')+' '+v.toLocaleString('es-AR',{maximumFractionDigits:0});
  }
}
function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('ver');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('ver'), 2600);
}

function nombreCliente(clienteId, fallback){

/* ---- cálculo del embudo (mismas fórmulas que la planilla) ----
   Ticket anual en USD = monto ÷ cotización, ×12 si el servicio es mensual.
   Ponderado = ticket anual × probabilidad de cierre.                        */
function probabilidadDe(l){
  if(l.probabilidad === '' || l.probabilidad === null || l.probabilidad === undefined)
    return (ESTADOS_LEAD[l.estado] || {}).prob || 0;
  return num(l.probabilidad);
}
function esMensual(l){ return (l.categoria || '').trim().toLowerCase() === 'mensual'; }
function ticketUSD(l){
  const monto = num(l.monto);
  if(!monto) return 0;
  const veces = esMensual(l) ? 12 : 1;
  if(l.moneda === 'USD') return monto * veces;
  const coti = num(l.cotizacionUSD) || num(DB.config.cotizacionUSD) || 1;
  return monto * veces / coti;
}
function ponderadoUSD(l){ return ticketUSD(l) * probabilidadDe(l) / 100; }
function diasEnCerrar(l){
  return (l.fechaCierre && l.fechaContacto) ? diasEntre(l.fechaContacto, l.fechaCierre) : null;
}
function fmtUSD(v){
  return 'US$ ' + Math.round(num(v)).toLocaleString('es-AR');
}

/* ---- cálculo de presupuestos ---- */
function totalPresupuesto(p){
  if(p.modo === 'horas'){
    const t = num(p.tarifaHora);
    let min = 0, max = 0;
    (p.fases||[]).forEach(f => { min += num(f.hsMin)*t; max += num(f.hsMax)*t; });
    return {min, max, total:max, rango: min !== max};
  }
  if(p.modo === 'planes'){
    const pl = (p.planes||[]).find(x=>x.id===p.planElegido) || (p.planes||[])[0];
    const v = pl ? num(pl.precio) : 0;
    return {min:v, max:v, total:v, rango:false};
  }
  const t = (p.items||[]).reduce((a,i)=> a + num(i.cantidad||1)*num(i.precioUnit), 0);
  return {min:t, max:t, total:t, rango:false};
}
function totalAranceles(p){
  return (p.aranceles||[]).reduce((a,x)=> a + num(x.monto), 0);
}
function horasPresupuesto(p){
  let min=0, max=0;
  (p.fases||[]).forEach(f=>{ min += num(f.hsMin); max += num(f.hsMax); });
  return {min, max};
}
function textoTotal(p){
  const t = totalPresupuesto(p);
  return t.rango && t.min !== t.max
    ? fmt(t.min, p.moneda)+' – '+fmt(t.max, p.moneda)
    : fmt(t.total, p.moneda);
}
function sumaHitos(p){ return (p.hitos||[]).reduce((a,h)=> a + num(h.pct), 0); }

/* ---- estado derivado de facturas ---- */
function estadoFactura(f){
  if(f.estado === 'cobrada') return 'cobrada';
  if(f.estado === 'emitida' && f.vencimiento && f.vencimiento < hoy()) return 'vencida';
  return f.estado;
}
function facturasDe(proyectoId){ return DB.facturas.filter(f=>f.proyectoId===proyectoId); }
function tareasDe(proyectoId){ return DB.tareas.filter(t=>t.proyectoId===proyectoId); }

/* ---- avisos del panel ---- */
function presupuestosSinRespuesta(){
  return DB.presupuestos
    .filter(p => (p.estado==='enviado' || p.estado==='seguimiento') && p.fechaEnvio)
    .map(p => ({p, dias: diasEntre(p.fechaEnvio, hoy())}))
    .sort((a,b)=> b.dias - a.dias);
}
function facturasVencidas(){
  return DB.facturas.filter(f => estadoFactura(f)==='vencida');
}
function tareasVencidas(){
  return DB.tareas.filter(t => t.estado!=='hecha' && t.vence && t.vence < hoy());
}
function proyectosParaAjustar(){
  return DB.proyectos.filter(p => p.estado==='activo' && p.recurrente && p.proximoAjuste && p.proximoAjuste <= hoy());
}

/* ---- modal ---- */
let alGuardarModal = null;

function abrirModal(titulo, html, opciones){
  opciones = opciones || {};
  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('modal-cuerpo').innerHTML = html;
  document.getElementById('modal').classList.toggle('ancho', !!opciones.ancho);
  const botones = opciones.botones || [
    {et:'Cancelar', accion:'cerrarModal()'},
    {et:'Guardar', accion:'guardarModal()', pri:true}
  ];
  document.getElementById('modal-pie').innerHTML = botones.map(b =>
    `<button class="btn ${b.pri?'pri':''} ${b.peligro?'peligro':''} ${b.izq?'izq':''}" onclick="${b.accion}">${esc(b.et)}</button>`
  ).join('');

  document.getElementById('velo').classList.add('abierto');
  const primero = document.querySelector('#modal-cuerpo input,#modal-cuerpo select,#modal-cuerpo textarea');
  if(primero) setTimeout(()=>primero.focus(), 60);
}
function cerrarModal(){
  document.getElementById('velo').classList.remove('abierto');
  document.getElementById('modal-cuerpo').innerHTML = '';
  alGuardarModal = null;
}
function guardarModal(){
  if(alGuardarModal){
    const ok = alGuardarModal(leerFormulario());
    if(ok === false) return;
  }
  cerrarModal();
}
function leerFormulario(){
  const datos = {};
  document.querySelectorAll('#modal-cuerpo [name]').forEach(el => {
    if(el.type === 'checkbox') datos[el.name] = el.checked;
    else datos[el.name] = el.value.trim();
  });
  return datos;
}
function confirmar(titulo, mensaje, alConfirmar, etiqueta){
  abrirModal(titulo, `<p style="font-size:.92rem;line-height:1.55">${mensaje}</p>`, {
    botones:[
      {et:'Cancelar', accion:'cerrarModal()'},
      {et: etiqueta || 'Confirmar', accion:'guardarModal()', pri:true, peligro:true}
    ],
    alGuardar: alConfirmar
  });
}

/* ---- helpers de formulario ---- */
function campo(nombre, etiqueta, valor, opciones){
  opciones = opciones || {};
  const tipo = opciones.tipo || 'text';
  const ayuda = opciones.ayuda ? `<div class="ayuda">${esc(opciones.ayuda)}</div>` : '';
  const op = opciones.opcional ? ' <span class="op">(opcional)</span>' : '';
  let control;
  if(tipo === 'textarea'){
    control = `<textarea name="${nombre}" rows="${opciones.filas||3}" placeholder="${esc(opciones.ph||'')}">${esc(valor||'')}</textarea>`;
  }else if(tipo === 'select'){
    control = `<select name="${nombre}">${(opciones.opciones||[]).map(o =>
      `<option value="${esc(o.v)}" ${String(o.v)===String(valor)?'selected':''}>${esc(o.et)}</option>`).join('')}</select>`;
  }else{
    control = `<input type="${tipo}" name="${nombre}" value="${esc(valor===0?'0':(valor||''))}" placeholder="${esc(opciones.ph||'')}" ${opciones.paso?`step="${opciones.paso}"`:''}/>`;
  }
  return `<div class="campo"><label>${esc(etiqueta)}${op}</label>${control}${ayuda}</div>`;
}

  const e = mapa[estado] || {et:estado, color:'gris'};

function acumular(mapa, moneda, monto){
  const m = moneda || 'ARS';
  mapa[m] = (mapa[m] || 0) + num(monto);
  return mapa;
}
function fmtMapa(mapa, vacioTexto){
  const claves = Object.keys(mapa).filter(k => mapa[k] > 0);
  if(!claves.length) return vacioTexto || fmt(0,'ARS');
  return claves.map(k => fmt(mapa[k], k)).join(' + ');
}
function totalesMes(mes){
  const r = {emitido:{}, cobrado:{}, porCobrar:{}, porEmitir:{}};
  DB.facturas.forEach(f => {
    const est = estadoFactura(f);
    if(f.fechaEmision && mesDe(f.fechaEmision) === mes) acumular(r.emitido, f.moneda, f.monto);
    if(f.fechaCobro && mesDe(f.fechaCobro) === mes) acumular(r.cobrado, f.moneda, f.monto);
    if(est === 'emitida' || est === 'vencida') acumular(r.porCobrar, f.moneda, f.monto);
    if(est === 'por_emitir') acumular(r.porEmitir, f.moneda, f.monto);
  });
  return r;
}

/* =======================  7. LEADS  ====================================== */

let filtroLead = 'abiertos';
let filtroFuente = '';
let filtroServicio = '';
let textoLead = '';
let ordenLead = 'fecha';

function vistaLeads(){
  const conteo = k => DB.leads.filter(l => l.estado === k).length;
  const pond = arr => arr.reduce((a,l) => a + ponderadoUSD(l), 0);
  const abiertos = DB.leads.filter(esAbierto);

  let lista;
  if(filtroLead === 'abiertos') lista = abiertos.slice();
  else if(filtroLead === 'todos') lista = DB.leads.slice();
  else lista = DB.leads.filter(l => l.estado === filtroLead);
  if(filtroFuente)  lista = lista.filter(l => (l.fuente||'') === filtroFuente);
  if(filtroServicio) lista = lista.filter(l => (l.servicio||'') === filtroServicio);
  if(textoLead){
    const q = textoLead.toLowerCase();
    lista = lista.filter(l => (l.nombre+' '+(l.empresa||'')+' '+(l.servicio||'')+' '+(l.categoria||'')+' '+(l.motivo||'')).toLowerCase().includes(q));
  }
  if(ordenLead === 'monto')          lista.sort((a,b) => ticketUSD(b) - ticketUSD(a));
  else if(ordenLead === 'ponderado') lista.sort((a,b) => ponderadoUSD(b) - ponderadoUSD(a));
  else if(ordenLead === 'seguimiento') lista.sort((a,b) => (a.proximoSeguimiento||'9999').localeCompare(b.proximoSeguimiento||'9999'));
  else lista.sort((a,b) => (b.fechaContacto||'').localeCompare(a.fechaContacto||''));

  const ganados  = DB.leads.filter(l => l.estado === 'ganado');
  const cerrados = DB.leads.filter(l => ['ganado','perdido','no_contesto'].includes(l.estado));
  const tasa = cerrados.length ? Math.round(ganados.length / cerrados.length * 100) : null;
  const ticketProm = ganados.length ? ganados.reduce((a,l) => a + ticketUSD(l), 0) / ganados.length : 0;
  const fuentes  = [...new Set(DB.leads.map(l => l.fuente).filter(Boolean))].sort();
  const servicios = [...new Set(DB.leads.map(l => l.servicio).filter(Boolean))].sort();

  return `
  <div class="cab">
    <div>
      <h1>Embudo</h1>
      <p class="sub">${abiertos.length} oportunidad${abiertos.length===1?'':'es'} abierta${abiertos.length===1?'':'s'} · ${DB.leads.length} leads en total</p>
    </div>
    <div class="acciones">
      <button class="btn" onclick="ir('datos')">Importar planilla</button>
      <button class="btn pri" onclick="formLead()">+ Nuevo lead</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="et">Embudo ponderado</div><div class="val chico">${fmtUSD(pond(abiertos))}</div>
      <div class="pie2">sobre ${fmtUSD(abiertos.reduce((a,l)=>a+ticketUSD(l),0))} en juego</div></div>
    <div class="kpi ${tasa!==null && tasa>=30?'ok':''}"><div class="et">Tasa de conversión</div>
      <div class="val">${tasa===null?'—':tasa+'%'}</div>
      <div class="pie2">${ganados.length} ganados de ${cerrados.length} cerrados</div></div>
    <div class="kpi"><div class="et">Ticket promedio ganado</div><div class="val chico">${fmtUSD(ticketProm)}</div>
      <div class="pie2">anualizado, en dólares</div></div>
    <div class="kpi"><div class="et">A seguir</div>
      <div class="val">${DB.leads.filter(l => esAbierto(l) && l.proximoSeguimiento && l.proximoSeguimiento <= hoy()).length}</div>
      <div class="pie2">con seguimiento vencido</div></div>
  </div>

  <div class="embudo">
    <button class="${filtroLead==='abiertos'?'on':''}" onclick="filtroLead='abiertos';router()">
      <span class="e">Abiertos</span><span class="v">${abiertos.length}</span>
      <span class="e">${fmtUSD(pond(abiertos))}</span></button>
    ${ORDEN_LEAD.map(k => `
      <button class="${filtroLead===k?'on':''}" onclick="filtroLead='${k}';router()">
        <span class="e">${esc(ESTADOS_LEAD[k].n)}· ${esc(ESTADOS_LEAD[k].et)}</span>
        <span class="v">${conteo(k)}</span>
        <span class="e">${fmtUSD(pond(DB.leads.filter(l=>l.estado===k)))}</span></button>`).join('')}
    <button class="${filtroLead==='todos'?'on':''}" onclick="filtroLead='todos';router()">
      <span class="e">Todos</span><span class="v">${DB.leads.length}</span><span class="e">&nbsp;</span></button>
  </div>

  <div class="filtros">
    <input type="text" placeholder="Buscar cliente, servicio o motivo…" value="${esc(textoLead)}"
      oninput="textoLead=this.value;clearTimeout(window._bl);window._bl=setTimeout(router,250)"/>
    <select onchange="filtroFuente=this.value;router()">
      <option value="">Todas las fuentes</option>
      ${fuentes.map(f => `<option value="${esc(f)}" ${filtroFuente===f?'selected':''}>${esc(f)}</option>`).join('')}
    </select>
    <select onchange="filtroServicio=this.value;router()">
      <option value="">Todos los servicios</option>
      ${servicios.map(s => `<option value="${esc(s)}" ${filtroServicio===s?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
    <select onchange="ordenLead=this.value;router()">
      <option value="fecha" ${ordenLead==='fecha'?'selected':''}>Más recientes primero</option>
      <option value="monto" ${ordenLead==='monto'?'selected':''}>Mayor monto</option>
      <option value="ponderado" ${ordenLead==='ponderado'?'selected':''}>Mayor ponderado</option>
      <option value="seguimiento" ${ordenLead==='seguimiento'?'selected':''}>Próximo seguimiento</option>
    </select>
    <span class="esp"></span>
    <span style="font-size:.82rem;color:var(--gris2)">${lista.length} de ${DB.leads.length}</span>
  </div>

  <div class="tarjeta">
    <div class="cuerpo sinpad">
      ${lista.length ? `
      <table class="tab">
        <thead><tr>
          <th>Cliente</th><th>Fuente</th><th>Servicio</th><th>Contacto</th>
          <th class="num">Monto</th><th class="num">Ponderado</th><th>Estado</th><th>Seguimiento</th><th></th>
        </tr></thead>
        <tbody>
        ${lista.map(l => {
          const atrasado = l.proximoSeguimiento && l.proximoSeguimiento < hoy() && esAbierto(l);
          const presus = DB.presupuestos.filter(p => p.leadId === l.id);
          const dias = diasEnCerrar(l);
          return `<tr>
            <td onclick="verLead('${l.id}')" style="cursor:pointer">
              <div class="prin">${esc(l.nombre)}</div>
              ${l.empresa ? `<div class="sec">${esc(l.empresa)}</div>` : ''}
              ${presus.length ? `<div class="sec">${presus.length} presupuesto${presus.length===1?'':'s'}</div>` : ''}
            </td>
            <td class="sec">${esc(l.fuente || '—')}</td>
            <td class="sec">${esc(l.servicio || '—')}${l.categoria?`<div class="sec">${esc(l.categoria)}</div>`:''}</td>
            <td class="sec">${fmtFecha(l.fechaContacto)}${dias!==null?`<div class="sec">cerró en ${dias} d</div>`:''}</td>
            <td class="num">${l.monto ? fmt(l.monto, l.moneda||'ARS') : '<span class="sec">—</span>'}
              ${esMensual(l) ? '<div class="sec">mensual</div>' : ''}</td>
            <td class="num">${ponderadoUSD(l) ? fmtUSD(ponderadoUSD(l)) : '<span class="sec">—</span>'}
              <div class="sec">${probabilidadDe(l)}%</div></td>
            <td>${chip(ESTADOS_LEAD, l.estado)}</td>
            <td class="${atrasado?'vencida':'sec'}">${l.proximoSeguimiento ? fmtFecha(l.proximoSeguimiento) : '—'}</td>
            <td class="acc">
              <button class="btn-txt" onclick="verLead('${l.id}')">Abrir</button>
              ${esAbierto(l) ? `<button class="btn-txt" onclick="nuevoPresupuesto('${l.id}')">Presupuestar</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>` : vacio('No hay leads con estos filtros.','<button class="btn pri" onclick="formLead()">+ Nuevo lead</button>')}
    </div>
  </div>`;
}

/* Agrega una fuente nueva a la lista y la deja elegida. */
function nuevaFuente(select){
  const nombre = prompt('¿De dónde viene este lead?');
  if(!nombre || !nombre.trim()){ select.value = ''; return; }
  const limpio = nombre.trim();
  DB.config.fuentes = DB.config.fuentes || [];
  if(!DB.config.fuentes.includes(limpio)){
    DB.config.fuentes.splice(Math.max(0, DB.config.fuentes.length - 1), 0, limpio);
    guardar();
  }
  const opcion = document.createElement('option');
  opcion.value = limpio; opcion.textContent = limpio;
  select.insertBefore(opcion, select.lastElementChild);
  select.value = limpio;
}

function agregarNotaLead(id){
  const l = buscarLead(id);
  abrirModal('Nota de seguimiento', `
    ${campo('texto','Qué pasó', '', {tipo:'textarea', filas:4, ph:'Llamada, mail enviado, respuesta del cliente…'})}

    alGuardar(d){
      if(!d.texto){ toast('Escribí la nota.'); return false; }

      l.proximoSeguimiento = d.proximoSeguimiento;
      l.estado = d.estado;
      refrescar();
      toast('Nota agregada.');
    }
  });

function eliminarLead(id){
  const l = buscarLead(id);
  confirmar('Eliminar lead', `¿Eliminar a <b>${esc(l.nombre)}</b> y sus notas? Los presupuestos que le hayas hecho no se borran.`, () => {
    DB.leads = DB.leads.filter(x => x.id !== id);
    refrescar();
    toast('Lead eliminado.');
  }, 'Eliminar');
}

          <td>${chip(ESTADOS_PRESU, p.estado)}</td>
          <td class="${abierto && dias>=7 ? 'vencida':'sec'}">${dias===null?'—':dias+'d'}</td>
          <td class="acc">
            <button class="btn-txt" onclick="ir('presupuesto/${p.id}')">Abrir</button>
            <button class="btn-txt" onclick="ir('imprimir/${p.id}')">Imprimir</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>` : vacio('No hay presupuestos con este filtro.','<button class="btn pri" onclick="nuevoPresupuesto()">+ Nuevo presupuesto</button>')}
  </div></div>`;
}

function nuevoPresupuesto(leadId){
  const lead = leadId ? buscarLead(leadId) : null;
  const opcionesServicio = [{v:'', et:'— Empezar en blanco —'}].concat(
    DB.catalogo.map(s => ({v:s.id, et:s.categoria+' · '+s.nombre})));
  const opcionesCliente = [{v:'', et:'— Cliente nuevo o lead —'}].concat(
    DB.clientes.map(c => ({v:c.id, et:c.nombreFantasia || c.razonSocial})));

  // Los leads abiertos primero, después el resto: casi siempre se presupuesta a uno abierto.
  const orden = l => (esAbierto(l) ? '0' : '1') + (l.fechaContacto || '');
  const leads = DB.leads.slice().sort((a,b) => orden(a).localeCompare(orden(b)) || (b.fechaContacto||'').localeCompare(a.fechaContacto||''));
  const opcionesLead = [{v:'', et:'— Sin lead —'}].concat(leads.map(l => ({
    v:l.id,
    et:(esAbierto(l) ? '' : '· ') + l.nombre + (l.servicio ? ' — ' + l.servicio : '') + ' (' + ESTADOS_LEAD[l.estado].et + ')'
  })));

  abrirModal('Nuevo presupuesto', `
    <div class="campo">
      <label>Lead <span class="op">(opcional)</span></label>
      <select name="leadId" onchange="prellenarDesdeLead(this.value)">
        ${opcionesLead.map(o => `<option value="${esc(o.v)}" ${o.v===(leadId||'')?'selected':''}>${esc(o.et)}</option>`).join('')}
      </select>
      <div class="ayuda">Al elegirlo se completan cliente, servicio y moneda, y el presupuesto queda vinculado a su seguimiento.</div>
    </div>
    ${campo('servicioId','Plantilla del catálogo', lead ? (servicioDeEmbudo(lead.servicio, lead.categoria)||'') : '', {tipo:'select', opciones:opcionesServicio,
      ayuda:'Carga alcance, entregables, fases, plazos, hitos y precio de referencia. Después ajustás todo.'})}
    ${campo('clienteId','Cliente existente', lead && lead.clienteId ? lead.clienteId : '', {tipo:'select', opciones:opcionesCliente, opcional:true})}
    ${campo('clienteNombre','Nombre del cliente', lead ? (lead.empresa || lead.nombre) : '', {ayuda:'Si elegiste un cliente existente, este campo se ignora.'})}
    ${campo('proyecto','Nombre del proyecto', lead ? [lead.servicio, lead.categoria].filter(Boolean).join(' · ') : '', {ph:'Inscripción RNPA línea de snacks'})}
  `, {
    alGuardar(d){
      if(!d.clienteId && !d.clienteNombre){ toast('Indicá el cliente.'); return false; }
      const elegido = d.leadId ? buscarLead(d.leadId) : null;
      const p = crearPresupuesto({
        servicioId:d.servicioId, clienteId:d.clienteId,
        clienteNombre:d.clienteId ? nombreCliente(d.clienteId) : d.clienteNombre,
        proyecto:d.proyecto, leadId:d.leadId || null
      });
      if(elegido){
        if(elegido.moneda) p.moneda = elegido.moneda;
        if(['primer_contacto','discovery'].includes(elegido.estado)) elegido.estado = 'presupuesto_enviado';
      }
      guardar();
      ir('presupuesto/'+p.id);
      toast('Presupuesto creado.');
    }
  });
}

/* Completa el resto del formulario con los datos del lead elegido. */
function prellenarDesdeLead(id){
  const l = id ? buscarLead(id) : null;
  const dentro = s => document.querySelector('#modal-cuerpo [name='+s+']');
  if(!l){ return; }
  const nombre = dentro('clienteNombre'), proyecto = dentro('proyecto'),
        servicio = dentro('servicioId'), cliente = dentro('clienteId');
  if(nombre && !nombre.value.trim()) nombre.value = l.empresa || l.nombre;
  if(proyecto && !proyecto.value.trim()) proyecto.value = [l.servicio, l.categoria].filter(Boolean).join(' · ');
  const equiv = servicioDeEmbudo(l.servicio, l.categoria);
  if(servicio && !servicio.value && equiv) servicio.value = equiv;
  if(cliente && l.clienteId) cliente.value = l.clienteId;
}

function crearPresupuesto(datos){
  const s = datos.servicioId ? buscarServicio(datos.servicioId) : null;
  DB.contadorPresupuesto = (DB.contadorPresupuesto||0) + 1;
  const p = {
    id: uid(),
    numero: 'P-' + String(new Date().getFullYear()).slice(2) + '-' + String(DB.contadorPresupuesto).padStart(3,'0'),
    version: 'v1.0',
    leadId: datos.leadId || null,
    clienteId: datos.clienteId || null,
    clienteNombre: datos.clienteNombre || '',
    proyecto: datos.proyecto || (s ? s.nombre : 'Nuevo proyecto'),
    servicioId: datos.servicioId || null,
    descripcion: s ? s.descripcion : '',
    fecha: hoy(),
    validezDias: DB.config.validezDias || 30,
    moneda: s ? s.moneda : 'ARS',
    modo: s ? s.modo : 'fijo',
    tarifaHora: DB.config.tarifaHora || 0,
    alcance: s ? s.alcance : '',
    entregables: s ? JSON.parse(JSON.stringify(s.entregables||[])) : [],
    fases: s ? JSON.parse(JSON.stringify(s.fases||[])) : [],
    items: s ? JSON.parse(JSON.stringify(s.items||[])) : [],
    planes: s && s.planes ? JSON.parse(JSON.stringify(s.planes)) : [],
    planElegido: s ? (s.planElegido||'') : '',
    aranceles: s ? JSON.parse(JSON.stringify(s.aranceles||[])) : [],
    requisitos: s ? (s.requisitos||[]).slice() : [],
    exclusiones: s ? (s.exclusiones||[]).slice() : [],
    hitos: s ? JSON.parse(JSON.stringify(s.hitos||[])) : [{nombre:'Anticipo',condicion:'Al aceptar la propuesta',pct:50},{nombre:'Saldo',condicion:'A la entrega final',pct:50}],
    plazos: s ? s.plazos : '',
    condicionesPago: s ? s.condicionesPago : '',
    notas: s ? s.notas : '',
    estado: 'borrador',
    fechaEnvio: '', fechaDecision: '', motivoRechazo: '',
    seguimientos: [],
    proyectoId: null
  };
  DB.presupuestos.push(p);
  guardar();
  return p;
}

/* ---- edición en vivo ---- */
function setCampo(id, campo, valor, numerico){
  const p = buscarPresu(id);
  if(!p) return;
  p[campo] = numerico ? num(valor) : valor;
  guardar();
  actualizarTotales(id);
}
function setItem(id, col, i, campo, valor, numerico){
  const p = buscarPresu(id);
  if(!p || !p[col] || !p[col][i]) return;
  p[col][i][campo] = numerico ? num(valor) : valor;
  guardar();
  actualizarTotales(id);
}
function setLineas(id, campo, valor){
  const p = buscarPresu(id);
  p[campo] = lineas(valor);
  guardar();
}
function agregarItem(id, col){
  const p = buscarPresu(id);
  p[col] = p[col] || [];
  const nuevos = {
    entregables:{titulo:'', descripcion:''},
    fases:{nombre:'', actividades:'', duracion:'', hsMin:0, hsMax:0},
    items:{concepto:'', detalle:'', cantidad:1, precioUnit:0},
    aranceles:{concepto:'', monto:0},
    hitos:{nombre:'', condicion:'', pct:0},
    planes:{id:'plan-'+Date.now(), nombre:'', detalle:'', precio:0, incluye:[]}
  };
  p[col].push(JSON.parse(JSON.stringify(nuevos[col] || {})));
  refrescar();
}
function quitarItem(id, col, i){
  const p = buscarPresu(id);
  p[col].splice(i,1);
  refrescar();
}
function actualizarTotales(id){
  const cont = document.getElementById('bloque-totales');
  if(cont) cont.innerHTML = bloqueTotales(buscarPresu(id));
  const enc = document.getElementById('enc-total');
  if(enc) enc.textContent = textoTotal(buscarPresu(id));
}

/* ---- listas dinámicas ---- */
function listaDinamica(pid, col, campos, etiqueta, cols){
  const p = buscarPresu(pid);
  const arr = p[col] || [];
  return `<div class="lista-din">
    ${arr.map((it,i) => `
      <div class="item-din" style="grid-template-columns:auto 1fr auto">
        <span class="n">${i+1}</span>
        <div class="lin" style="grid-template-columns:${cols}">
          ${campos.map(c => c.tipo === 'textarea'
            ? `<textarea rows="2" placeholder="${esc(c.ph)}" onchange="setItem('${pid}','${col}',${i},'${c.k}',this.value)">${esc(it[c.k]||'')}</textarea>`
            : `<input type="${c.tipo||'text'}" ${c.tipo==='number'?'step="any"':''} placeholder="${esc(c.ph)}"
                 value="${esc(it[c.k]===0?'0':(it[c.k]||''))}"
                 onchange="setItem('${pid}','${col}',${i},'${c.k}',this.value,${c.tipo==='number'})"/>`).join('')}
        </div>
        <button class="quitar" onclick="quitarItem('${pid}','${col}',${i})" title="Quitar">&times;</button>
      </div>`).join('')}
    <div><button class="btn mini" onclick="agregarItem('${pid}','${col}')">+ ${esc(etiqueta)}</button></div>
  </div>`;
}

function bloqueTotales(p){
  const t = totalPresupuesto(p);
  const ar = totalAranceles(p);
  const hs = horasPresupuesto(p);
  const suma = sumaHitos(p);
  return `
    ${p.modo === 'horas' ? `<div class="tot-linea"><span>Horas estimadas</span><span class="v">${hs.min} – ${hs.max} h</span></div>
      <div class="tot-linea"><span>Tarifa por hora</span><span class="v">${fmt(p.tarifaHora, p.moneda)}</span></div>` : ''}
    <div class="tot-linea"><span>Honorarios</span><span class="v">${t.rango && t.min!==t.max ? fmt(t.min,p.moneda)+' – '+fmt(t.max,p.moneda) : fmt(t.total,p.moneda)}</span></div>
    ${ar ? `<div class="tot-linea"><span>Aranceles oficiales <span class="sec">(no incluidos en los honorarios)</span></span><span class="v">${fmt(ar,p.moneda)}</span></div>` : ''}
    <div class="tot-linea grande"><span>Total del presupuesto</span><span class="v">${textoTotal(p)}</span></div>
    <div style="margin-top:.8rem">
      ${(p.hitos||[]).map(h => `<div class="tot-linea"><span>${esc(h.nombre)} <span class="sec">${esc(h.condicion)}</span></span>
        <span class="v">${num(h.pct)}% · ${fmt(t.total*num(h.pct)/100, p.moneda)}</span></div>`).join('')}
      ${suma !== 100 ? `<div class="aviso warn" style="margin-top:.5rem">Los hitos suman <b>${suma}%</b>. Ajustalos para que sumen 100%.</div>` : ''}
    </div>`;
}

function duplicarPresupuesto(id){
  const p = buscarPresu(id);
  const copia = JSON.parse(JSON.stringify(p));
  copia.id = uid();
  const m = /v(\d+)\.(\d+)/.exec(p.version || 'v1.0');
  copia.version = m ? 'v'+(Number(m[1])+1)+'.0' : 'v2.0';

function aceptarPresupuesto(id){
  const p = buscarPresu(id);

  const opcionesCliente = [{v:'', et:'— Crear cliente nuevo —'}].concat(

  abrirModal('Aceptar presupuesto y dar de alta al cliente', `
    <div class="aviso ok">Se va a crear el cliente y el proyecto, se generan las tareas a partir de las fases y el plan de facturación a partir de los hitos.</div>
    <div class="seccion-form"><h3>Cliente</h3>
      ${campo('clienteId','Cliente existente', p.clienteId||'', {tipo:'select', opciones:opcionesCliente})}
      ${campo('razonSocial','Razón social', p.clienteNombre||'')}
      <div class="fila c2">
        ${campo('nombreFantasia','Nombre de fantasía', p.clienteNombre||'', {opcional:true})}
        ${campo('cuit','CUIT', '', {opcional:true})}
      </div>
      <div class="fila c2">
        ${campo('contacto','Persona de contacto', lead?lead.nombre:'', {opcional:true})}
        ${campo('telefono','Teléfono', lead?lead.telefono:'', {opcional:true})}
      </div>
      <div class="fila c2">
        ${campo('email','Email', lead?lead.email:'', {tipo:'email', opcional:true})}
        ${campo('rne','RNE', '', {opcional:true})}
      </div>
      ${campo('domicilio','Domicilio', '', {opcional:true})}
    </div>
    <div class="seccion-form"><h3>Proyecto</h3>
      <div class="fila c2">
        ${campo('fechaInicio','Fecha de inicio', hoy(), {tipo:'date'})}
        ${campo('fechaDecision','Fecha de aceptación', hoy(), {tipo:'date'})}
      </div>
      ${recurrente ? `
        <div class="aviso info">Servicio recurrente: se va a registrar como abono mensual de <b>${fmt(totalPresupuesto(p).total, p.moneda)}</b>, con ajuste trimestral y checklist que se regenera cada mes.</div>
        <div class="fila c2">
          ${campo('diaFacturacion','Día de facturación', '1', {tipo:'number', ayuda:'Día del mes en que emitís la factura.'})}
          ${campo('proximoAjuste','Próximo ajuste de honorarios', sumarMeses(mesHoy(),3)+'-01', {tipo:'date'})}
        </div>` : ''}
      <label style="font-size:.85rem;display:flex;gap:.45rem;align-items:center;margin-bottom:.5rem">
        <input type="checkbox" name="generarTareas" checked/> Generar las tareas del proyecto</label>
      <label style="font-size:.85rem;display:flex;gap:.45rem;align-items:center">
        <input type="checkbox" name="generarFacturas" checked/> Generar el plan de facturación</label>
    </div>
  `, {ancho:true, alGuardar(d){
    if(!d.clienteId && !d.razonSocial){ toast('Indicá la razón social.'); return false; }
    let cliente = d.clienteId ? buscarCliente(d.clienteId) : null;
    if(!cliente){
      cliente = {
        id:uid(), razonSocial:d.razonSocial, nombreFantasia:d.nombreFantasia || d.razonSocial,
        cuit:d.cuit, contacto:d.contacto, telefono:d.telefono, email:d.email,
        rne:d.rne, domicilio:d.domicilio, rubro:lead?lead.rubro:'',
        fechaAlta:hoy(), leadId:p.leadId || null, notas:[]
      };
      DB.clientes.push(cliente);
    }
    const total = totalPresupuesto(p).total;
    const proy = {
      id:uid(), clienteId:cliente.id, presupuestoId:p.id, nombre:p.proyecto,
      servicioId:p.servicioId, estado:'activo', fechaInicio:d.fechaInicio || hoy(),
      moneda:p.moneda, montoTotal:total, recurrente:recurrente,
      honorarioMensual: recurrente ? total : 0,
      diaFacturacion: recurrente ? num(d.diaFacturacion)||1 : 0,
      proximoAjuste: recurrente ? d.proximoAjuste : '',
      ultimoMesGenerado: ''
    };
    DB.proyectos.push(proy);

    if(d.generarTareas) generarTareasIniciales(proy, p);
    if(d.generarFacturas) generarFacturasIniciales(proy, p);

    p.estado = 'aceptado';
    p.fechaDecision = d.fechaDecision || hoy();
    p.clienteId = cliente.id;
    p.proyectoId = proy.id;
    if(lead){ lead.estado = 'ganado'; lead.probabilidad = ''; lead.proximoSeguimiento = '';
      lead.fechaCierre = p.fechaDecision; lead.clienteId = cliente.id; }

    guardar();
    ir('proyecto/'+proy.id);
    toast('Cliente y proyecto dados de alta.');
  }});
}

function generarTareasIniciales(proy, p){
  const serv = buscarServicio(p.servicioId);
  if(proy.recurrente && serv && serv.tareasMensuales){
    generarTareasDelMes(proy, mesDe(proy.fechaInicio));
  }
  let fecha = proy.fechaInicio;
  (p.fases||[]).forEach((f, i) => {
    fecha = sumarDias(fecha, i === 0 ? 7 : 14);
    DB.tareas.push({
      id:uid(), clienteId:proy.clienteId, proyectoId:proy.id,
      titulo:f.nombre || ('Fase '+(i+1)),
      detalle:f.actividades || '',
      fase:f.nombre || '',
      mes:mesDe(fecha), vence:fecha, estado:'pendiente', notas:'', recurrente:false
    });
  });
}

function generarTareasDelMes(proy, mes){
  const serv = buscarServicio(proy.servicioId);
  if(!serv || !serv.tareasMensuales) return 0;
  const ya = DB.tareas.some(t => t.proyectoId === proy.id && t.mes === mes && t.recurrente);
  if(ya) return 0;
  serv.tareasMensuales.forEach((titulo, i) => {
    DB.tareas.push({
      id:uid(), clienteId:proy.clienteId, proyectoId:proy.id,
      titulo, detalle:'', fase:'Servicio mensual', mes,
      vence: mes+'-'+String(Math.min(7+i*5, 28)).padStart(2,'0'),
      estado:'pendiente', notas:'', recurrente:true
    });
  });
  proy.ultimoMesGenerado = mes;
  return serv.tareasMensuales.length;
}

function generarFacturasIniciales(proy, p){
  const total = totalPresupuesto(p).total;
  if(proy.recurrente){
    crearFacturaMensual(proy, mesDe(proy.fechaInicio));
    return;
  }
  (p.hitos||[]).forEach(h => {
    DB.facturas.push({
      id:uid(), clienteId:proy.clienteId, proyectoId:proy.id,
      concepto:(h.nombre||'Hito') + (h.condicion ? ' — '+h.condicion : ''),
      moneda:p.moneda, monto: total * num(h.pct) / 100, pct:num(h.pct),
      estado:'por_emitir', numero:'', fechaEmision:'', vencimiento:'', fechaCobro:''
    });
  });
}

function crearFacturaMensual(proy, mes){
  const existe = DB.facturas.some(f => f.proyectoId === proy.id && f.mesServicio === mes);
  if(existe) return false;
  DB.facturas.push({
    id:uid(), clienteId:proy.clienteId, proyectoId:proy.id,
    concepto:'Abono ' + etiquetaMes(mes), mesServicio:mes,
    moneda:proy.moneda, monto:num(proy.honorarioMensual), pct:100,
    estado:'por_emitir', numero:'', fechaEmision:'', vencimiento:'', fechaCobro:''
  });
  return true;
}

function vistaProyecto(id){
  const p = buscarProy(id);
  if(!p) return `<div class="aviso err">No se encontró el proyecto.</div>`;
  const c = buscarCliente(p.clienteId);
  const ts = tareasDe(id);
  const hechas = ts.filter(t => t.estado === 'hecha').length;
  const pct = ts.length ? Math.round(hechas/ts.length*100) : 0;
  const fs = facturasDe(id);
  const emitido = {}, cobrado = {}, pendiente = {};
  fs.forEach(f => {
    if(f.fechaEmision) acumular(emitido, f.moneda, f.monto);
    if(f.fechaCobro) acumular(cobrado, f.moneda, f.monto);
    const e = estadoFactura(f);
    if(e !== 'cobrada') acumular(pendiente, f.moneda, f.monto);
  });
  const ajuste = p.recurrente && p.proximoAjuste && p.proximoAjuste <= hoy();

  return `
  <div class="cab">
    <div>
      <h1>${esc(p.nombre)}</h1>
      <p class="sub">
        <a href="#/cliente/${p.clienteId}">${esc(c ? (c.nombreFantasia||c.razonSocial) : 'Cliente')}</a> ·
        ${chip(ESTADOS_PROY, p.estado)} · inicio ${fmtFecha(p.fechaInicio)} ·
        ${p.recurrente ? 'abono mensual '+fmt(p.honorarioMensual, p.moneda) : fmt(p.montoTotal, p.moneda)}
        ${p.presupuestoId ? ` · <a href="#/presupuesto/${p.presupuestoId}">ver presupuesto</a>` : ''}
      </p>
    </div>
    <div class="acciones">
      <button class="btn" onclick="formProyecto('${p.id}')">Editar</button>
      ${p.recurrente ? `<button class="btn" onclick="generarMesProyecto('${p.id}')">Generar mes</button>` : ''}
      <button class="btn" onclick="formTarea(null,'${p.id}')">+ Tarea</button>
      <button class="btn" onclick="formFactura(null,'${p.id}')">+ Factura</button>
    </div>
  </div>

  ${ajuste ? `<div class="aviso warn">El honorario mensual tiene <b>ajuste pendiente</b> desde el ${fmtFecha(p.proximoAjuste)}.
    <button class="btn mini" onclick="ajustarHonorario('${p.id}')">Ajustar ahora</button></div>` : ''}

  <div class="kpis">
    <div class="kpi ${pct===100?'ok':''}"><div class="et">Avance</div><div class="val">${pct}%</div>
      <div class="pie2">${hechas} de ${ts.length} tareas</div></div>
    <div class="kpi"><div class="et">Facturado</div><div class="val chico">${fmtMapa(emitido,'—')}</div></div>
    <div class="kpi"><div class="et">Cobrado</div><div class="val chico">${fmtMapa(cobrado,'—')}</div></div>
    <div class="kpi ${Object.keys(pendiente).length?'alerta':''}"><div class="et">Pendiente</div><div class="val chico">${fmtMapa(pendiente,'—')}</div></div>
  </div>

  <div class="tarjeta">
    <h2>Tareas <span class="der"><button class="btn mini" onclick="formTarea(null,'${p.id}')">+ Tarea</button></span></h2>
    <div class="cuerpo sinpad">
      ${ts.length ? ts.slice().sort((a,b)=>(a.vence||'9999').localeCompare(b.vence||'9999')).map(t => filaTarea(t, true)).join('') : vacio('Sin tareas.')}
    </div>
  </div>

  <div class="tarjeta">
    <h2>Facturación <span class="der"><button class="btn mini" onclick="formFactura(null,'${p.id}')">+ Factura</button></span></h2>
    <div class="cuerpo sinpad">
      ${fs.length ? tablaFacturas(fs) : vacio('Sin facturas.')}
    </div>
  </div>`;
}

function formProyecto(id){
  const p = buscarProy(id);
  abrirModal('Editar proyecto', `
    ${campo('nombre','Nombre', p.nombre)}
    <div class="fila c2">
      ${campo('estado','Estado', p.estado, {tipo:'select', opciones:opcionesEstado(ESTADOS_PROY)})}
      ${campo('fechaInicio','Fecha de inicio', p.fechaInicio, {tipo:'date'})}
    </div>
    ${p.recurrente ? `<div class="fila c3">
      ${campo('honorarioMensual','Honorario mensual', p.honorarioMensual, {tipo:'number'})}
      ${campo('diaFacturacion','Día de facturación', p.diaFacturacion||1, {tipo:'number'})}
      ${campo('proximoAjuste','Próximo ajuste', p.proximoAjuste||'', {tipo:'date'})}
    </div>` : campo('montoTotal','Monto total', p.montoTotal, {tipo:'number'})}
  `, {
    alGuardar(d){
      p.nombre = d.nombre; p.estado = d.estado; p.fechaInicio = d.fechaInicio;
      if(p.recurrente){
        p.honorarioMensual = num(d.honorarioMensual);
        p.diaFacturacion = num(d.diaFacturacion) || 1;
        p.proximoAjuste = d.proximoAjuste;
      }else{
        p.montoTotal = num(d.montoTotal);
      }
      refrescar(); toast('Proyecto actualizado.');
    }
  });
}

function ajustarHonorario(id){
  const p = buscarProy(id);
  abrirModal('Ajustar honorario mensual', `
    <p style="font-size:.86rem;margin-bottom:.9rem">Honorario vigente: <b>${fmt(p.honorarioMensual, p.moneda)}</b>.</p>
    ${campo('pct','Ajuste (%)', '', {tipo:'number', opcional:true, ayuda:'Cargá el % o directamente el nuevo importe.'})}
    ${campo('nuevo','Nuevo honorario', '', {tipo:'number', opcional:true})}
    ${campo('proximoAjuste','Próximo ajuste', sumarMeses(mesHoy(),3)+'-01', {tipo:'date'})}
  `, {
    alGuardar(d){
      let nuevo = num(d.nuevo);
      if(!nuevo && d.pct) nuevo = Math.round(p.honorarioMensual * (1 + num(d.pct)/100));
      if(!nuevo){ toast('Indicá el % o el nuevo importe.'); return false; }
      p.honorarioMensual = nuevo;
      p.proximoAjuste = d.proximoAjuste;
      refrescar();
      toast('Honorario actualizado a '+fmt(nuevo, p.moneda)+'.');
    }
  });
}

function generarMesProyecto(id){
  const p = buscarProy(id);
  const mes = mesHoy();
  const nt = generarTareasDelMes(p, mes);
  const nf = crearFacturaMensual(p, mes);
  refrescar();
  toast(nt || nf ? `Generado ${etiquetaMes(mes)}: ${nt} tarea(s)${nf?' y la factura del abono':''}.` : 'El mes ya estaba generado.');
}

/* =======================  10. MI MES (TAREAS)  =========================== */

let mesVista = mesHoy();
let verHechas = true;

function filaTarea(t, mostrarProyecto){
  const proy = buscarProy(t.proyectoId);
  const atrasada = t.estado !== 'hecha' && t.vence && t.vence < hoy();
  const hoyMismo = t.estado !== 'hecha' && t.vence === hoy();
  return `<div class="tarea ${t.estado==='hecha'?'hecha':''}">
    <input type="checkbox" ${t.estado==='hecha'?'checked':''} onchange="alternarTarea('${t.id}')"/>
    <div class="cont">
      <div class="tit">${esc(t.titulo)}</div>
      <div class="meta">
        ${mostrarProyecto===true ? '' : `<span>${esc(nombreCliente(t.clienteId))}</span>`}
        ${proy && mostrarProyecto!==true ? `<span>· ${esc(proy.nombre)}</span>` : ''}
        ${t.fase ? `<span>· ${esc(t.fase)}</span>` : ''}
        ${t.vence ? `<span class="${atrasada?'vencida':(hoyMismo?'vence-hoy':'')}">· ${atrasada?'venció':'vence'} ${fmtFecha(t.vence)}</span>` : ''}
        ${t.estado!=='pendiente' && t.estado!=='hecha' ? '· '+chip(ESTADOS_TAREA,t.estado) : ''}
        ${t.notas ? `<span>· ${esc(t.notas)}</span>` : ''}
      </div>
    </div>
    <div class="der">
      <button class="btn-txt" onclick="formTarea('${t.id}')">Editar</button>
    </div>
  </div>`;
}

function vistaMes(){
  const tareas = DB.tareas.filter(t => t.mes === mesVista);
  const visibles = verHechas ? tareas : tareas.filter(t => t.estado !== 'hecha');
  const hechas = tareas.filter(t => t.estado === 'hecha').length;
  const pct = tareas.length ? Math.round(hechas/tareas.length*100) : 0;
  const atrasadas = tareas.filter(t => t.estado !== 'hecha' && t.vence && t.vence < hoy()).length;

  const porCliente = {};
  visibles.forEach(t => {
    const k = t.clienteId || 'sin';
    (porCliente[k] = porCliente[k] || []).push(t);
  });
  const recurrentesSinGenerar = DB.proyectos.filter(p =>
    p.estado === 'activo' && p.recurrente &&
    !DB.tareas.some(t => t.proyectoId === p.id && t.mes === mesVista && t.recurrente));

  return `
  <div class="cab">
    <div>
      <h1>Mi mes</h1>
      <p class="sub">${etiquetaMes(mesVista).replace(/^./,c=>c.toUpperCase())} · ${hechas} de ${tareas.length} tareas hechas${atrasadas?' · '+atrasadas+' atrasada'+(atrasadas===1?'':'s'):''}</p>
    </div>
    <div class="acciones">
      <button class="btn" onclick="mesVista=sumarMeses(mesVista,-1);router()">←</button>
      <input type="month" value="${mesVista}" onchange="mesVista=this.value;router()"
        style="border:1px solid var(--bd2);border-radius:7px;padding:.36rem .6rem"/>
      <button class="btn" onclick="mesVista=sumarMeses(mesVista,1);router()">→</button>
      <button class="btn" onclick="formTarea()">+ Tarea</button>
    </div>
  </div>

  ${tareas.length ? `<div class="kpis"><div class="kpi ${pct===100?'ok':''}">
    <div class="et">Avance del mes</div><div class="val">${pct}%</div>
    <div class="barra" style="margin-top:.5rem"><i style="width:${pct}%"></i></div>
  </div></div>` : ''}

  ${recurrentesSinGenerar.length ? `<div class="aviso info">
    ${recurrentesSinGenerar.length} servicio${recurrentesSinGenerar.length===1?'':'s'} recurrente${recurrentesSinGenerar.length===1?'':'s'} sin checklist para ${etiquetaMes(mesVista)}.
    <button class="btn mini" onclick="generarMesTodos()">Generar el checklist del mes</button>
  </div>` : ''}

  <div class="filtros">
    <label style="font-size:.85rem;display:flex;gap:.4rem;align-items:center">
      <input type="checkbox" ${verHechas?'checked':''} onchange="verHechas=this.checked;router()"/> Mostrar las hechas</label>
    <span class="esp"></span>
    <button class="btn mini" onclick="mesVista=mesHoy();router()">Ir al mes actual</button>
  </div>

  <div class="tarjeta"><div class="cuerpo sinpad">
    ${Object.keys(porCliente).length ? Object.keys(porCliente).map(k => {
      const lista = porCliente[k].slice().sort((a,b)=>(a.vence||'9999').localeCompare(b.vence||'9999'));
      const h = lista.filter(t=>t.estado==='hecha').length;
      return `<div class="grupo-cliente">
        <h3>
          <span>${k==='sin' ? 'Sin cliente' : esc(nombreCliente(k))}</span>
          <span class="proy">${h}/${lista.length}</span>
        </h3>
        ${lista.map(t => filaTarea(t)).join('')}
      </div>`;
    }).join('') : vacio('No hay tareas para '+etiquetaMes(mesVista)+'.','<button class="btn pri" onclick="formTarea()">+ Agregar tarea</button>')}
  </div></div>`;
}

function alternarTarea(id){
  const t = DB.tareas.find(x => x.id === id);
  if(!t) return;
  t.estado = t.estado === 'hecha' ? 'pendiente' : 'hecha';
  t.fechaHecha = t.estado === 'hecha' ? hoy() : '';
  refrescar();
}

function formTarea(id, proyectoId){
  const t = id ? DB.tareas.find(x => x.id === id) : null;
  const proyectos = DB.proyectos.filter(p => p.estado !== 'finalizado');
  const opcionesProy = [{v:'', et:'— Sin proyecto —'}].concat(
    proyectos.map(p => ({v:p.id, et:nombreCliente(p.clienteId)+' · '+p.nombre})));
  const proyElegido = t ? t.proyectoId : (proyectoId || '');
  abrirModal(id ? 'Editar tarea' : 'Nueva tarea', `
    ${campo('titulo','Tarea', t?t.titulo:'')}
    ${campo('proyectoId','Proyecto', proyElegido, {tipo:'select', opciones:opcionesProy})}
    <div class="fila c3">
      ${campo('mes','Mes', t?t.mes:mesVista, {tipo:'month'})}
      ${campo('vence','Vence', t?t.vence:'', {tipo:'date', opcional:true})}
      ${campo('estado','Estado', t?t.estado:'pendiente', {tipo:'select', opciones:opcionesEstado(ESTADOS_TAREA)})}
    </div>
    ${campo('detalle','Detalle', t?t.detalle:'', {tipo:'textarea', opcional:true, filas:2})}
    ${campo('notas','Nota corta', t?t.notas:'', {opcional:true, ayuda:'Se muestra junto a la tarea en el checklist.'})}
  `, {
    botones: id ? [
      {et:'Eliminar', accion:`eliminarTarea('${id}')`, peligro:true, izq:true},
      {et:'Cancelar', accion:'cerrarModal()'},
      {et:'Guardar', accion:'guardarModal()', pri:true}
    ] : undefined,
    alGuardar(d){
      if(!d.titulo){ toast('Poné el título de la tarea.'); return false; }
      const proy = d.proyectoId ? buscarProy(d.proyectoId) : null;
      let ta = t;
      if(!ta){ ta = {id:uid(), recurrente:false}; DB.tareas.push(ta); }
      Object.assign(ta, {
        titulo:d.titulo, proyectoId:d.proyectoId || null,
        clienteId: proy ? proy.clienteId : (ta.clienteId || null),
        mes:d.mes || mesVista, vence:d.vence, estado:d.estado,
        detalle:d.detalle, notas:d.notas
      });
      refrescar();
      toast(id ? 'Tarea actualizada.' : 'Tarea creada.');
    }
  });
}

function eliminarTarea(id){
  DB.tareas = DB.tareas.filter(t => t.id !== id);
  refrescar();
  cerrarModal();
  toast('Tarea eliminada.');
}

function generarMesTodos(){
  let tareas = 0, facturas = 0;
  DB.proyectos.filter(p => p.estado === 'activo' && p.recurrente).forEach(p => {
    tareas += generarTareasDelMes(p, mesVista);
    if(crearFacturaMensual(p, mesVista)) facturas++;
  });
  refrescar();
  toast(`Generadas ${tareas} tarea(s) y ${facturas} factura(s) para ${etiquetaMes(mesVista)}.`);
}

/* =======================  11. FACTURACIÓN  =============================== */

        </td>
      </tr>`;

function vistaFacturacion(){
  const t = totalesMes(mesFact);
  const porEmitir = DB.facturas.filter(f => estadoFactura(f) === 'por_emitir');
  const pendientes = DB.facturas.filter(f => ['emitida','vencida'].includes(estadoFactura(f)))
    .sort((a,b)=>(a.vencimiento||'9999').localeCompare(b.vencimiento||'9999'));
  const delMes = DB.facturas.filter(f => f.fechaEmision && mesDe(f.fechaEmision) === mesFact)
    .sort((a,b)=>(b.fechaEmision||'').localeCompare(a.fechaEmision||''));
  const recurrentesSinFactura = DB.proyectos.filter(p =>
    p.estado === 'activo' && p.recurrente && !DB.facturas.some(f => f.proyectoId === p.id && f.mesServicio === mesFact));

  return `
  <div class="cab">
    <div>
      <h1>Facturación</h1>
      <p class="sub">${etiquetaMes(mesFact).replace(/^./,c=>c.toUpperCase())} · registrás acá la factura que emitís en ARCA y su cobro</p>
    </div>
    <div class="acciones">
      <button class="btn" onclick="mesFact=sumarMeses(mesFact,-1);router()">←</button>
      <input type="month" value="${mesFact}" onchange="mesFact=this.value;router()"
        style="border:1px solid var(--bd2);border-radius:7px;padding:.36rem .6rem"/>
      <button class="btn" onclick="mesFact=sumarMeses(mesFact,1);router()">→</button>
      <button class="btn" onclick="formFactura()">+ Factura</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="et">Emitido en el mes</div><div class="val chico">${fmtMapa(t.emitido,'—')}</div>
      <div class="pie2">${delMes.length} comprobante${delMes.length===1?'':'s'}</div></div>
    <div class="kpi ok"><div class="et">Cobrado en el mes</div><div class="val chico">${fmtMapa(t.cobrado,'—')}</div></div>
    <div class="kpi ${Object.keys(t.porCobrar).length?'alerta':''}"><div class="et">Pendiente de cobro</div>
      <div class="val chico">${fmtMapa(t.porCobrar,'—')}</div>
      <div class="pie2">${pendientes.filter(f=>estadoFactura(f)==='vencida').length} vencida(s)</div></div>
    <div class="kpi"><div class="et">Por emitir</div><div class="val chico">${fmtMapa(t.porEmitir,'—')}</div>
      <div class="pie2">${porEmitir.length} hito(s) pendiente(s)</div></div>
  </div>

  ${recurrentesSinFactura.length ? `<div class="aviso info">
    ${recurrentesSinFactura.length} abono${recurrentesSinFactura.length===1?'':'s'} mensual${recurrentesSinFactura.length===1?'':'es'} sin factura para ${etiquetaMes(mesFact)}.
    <button class="btn mini" onclick="generarAbonos()">Generar los abonos del mes</button>
  </div>` : ''}

  <div class="tarjeta">
    <h2>Por emitir <span class="chip gris">${porEmitir.length}</span></h2>
    <div class="cuerpo sinpad">${porEmitir.length ? tablaFacturas(porEmitir) : vacio('No hay hitos pendientes de facturar.')}</div>
  </div>

  <div class="tarjeta">
    <h2>Pendientes de cobro <span class="chip ${pendientes.some(f=>estadoFactura(f)==='vencida')?'rojo':'azul'}">${pendientes.length}</span></h2>
    <div class="cuerpo sinpad">${pendientes.length ? tablaFacturas(pendientes) : vacio('No hay facturas pendientes de cobro.')}</div>
  </div>

  <div class="tarjeta">
    <h2>Emitidas en ${esc(etiquetaMes(mesFact))} <span class="chip gris">${delMes.length}</span></h2>
    <div class="cuerpo sinpad">${delMes.length ? tablaFacturas(delMes) : vacio('Sin comprobantes emitidos este mes.')}</div>
  </div>`;
}

    ${campo('concepto','Concepto', f?f.concepto:'')}

      ${campo('moneda','Moneda', f?f.moneda:'ARS', {tipo:'select', opciones:[{v:'ARS',et:'Pesos (ARS)'},{v:'USD',et:'Dólares (USD)'}]})}

    </div>
    <div class="fila c2">
      ${campo('numero','N° de comprobante', f?f.numero:'', {opcional:true, ph:'0001-00000123'})}
      ${campo('fechaEmision','Fecha de emisión', f?f.fechaEmision:'', {tipo:'date', opcional:true})}
    </div>
    <div class="fila c2">
      ${campo('vencimiento','Vencimiento', f?f.vencimiento:'', {tipo:'date', opcional:true})}
      ${campo('fechaCobro','Fecha de cobro', f?f.fechaCobro:'', {tipo:'date', opcional:true})}
    </div>
  `, {
    botones: id ? [
      {et:'Eliminar', accion:`eliminarFactura('${id}')`, peligro:true, izq:true},
      {et:'Cancelar', accion:'cerrarModal()'},
      {et:'Guardar', accion:'guardarModal()', pri:true}
    ] : undefined,
    alGuardar(d){
      if(!d.concepto){ toast('Poné el concepto.'); return false; }
      const proy = d.proyectoId ? buscarProy(d.proyectoId) : null;
      let fa = f;
      if(!fa){ fa = {id:uid()}; DB.facturas.push(fa); }
      Object.assign(fa, {
        proyectoId:d.proyectoId || null,
        clienteId: proy ? proy.clienteId : (fa.clienteId || null),
        concepto:d.concepto, monto:num(d.monto), moneda:d.moneda, estado:d.estado,
        numero:d.numero, fechaEmision:d.fechaEmision, vencimiento:d.vencimiento, fechaCobro:d.fechaCobro
      });
      if(fa.estado === 'cobrada' && !fa.fechaCobro) fa.fechaCobro = hoy();
      refrescar();
      toast(id ? 'Factura actualizada.' : 'Factura creada.');
    }
  });
}

function cobrarFactura(id){

function eliminarFactura(id){
  DB.facturas = DB.facturas.filter(f => f.id !== id);

function generarAbonos(){
  let n = 0;
  DB.proyectos.filter(p => p.estado === 'activo' && p.recurrente).forEach(p => {
    if(crearFacturaMensual(p, mesFact)) n++;
  });
  refrescar();
  toast(n ? `Generadas ${n} factura(s) de abono para ${etiquetaMes(mesFact)}.` : 'Ya estaban generadas.');
}

/* ---- edición de servicios ---- */
function setServ(id, campo, valor, numerico){
  const s = buscarServicio(id);
  s[campo] = numerico ? num(valor) : valor;
  guardar();
}
function setServLineas(id, campo, valor){
  const s = buscarServicio(id);
  s[campo] = lineas(valor);
  guardar();
}
function setServItem(id, col, i, campo, valor, numerico){
  const s = buscarServicio(id);
  s[col][i][campo] = numerico ? num(valor) : valor;
  guardar();
}
function agregarServItem(id, col){
  const s = buscarServicio(id);
  s[col] = s[col] || [];
  const nuevos = {
    entregables:{titulo:'', descripcion:''},
    fases:{nombre:'', actividades:'', duracion:'', hsMin:0, hsMax:0},
    items:{concepto:'', detalle:'', cantidad:1, precioUnit:0},
    aranceles:{concepto:'', monto:0},
    hitos:{nombre:'', condicion:'', pct:0}
  };
  s[col].push(JSON.parse(JSON.stringify(nuevos[col] || {})));
  refrescar();
}
function quitarServItem(id, col, i){
  const s = buscarServicio(id);
  s[col].splice(i,1);
  refrescar();
}
function listaDinServ(sid, col, campos, etiqueta, cols){
  const s = buscarServicio(sid);
  const arr = s[col] || [];
  return `<div class="lista-din">
    ${arr.map((it,i) => `
      <div class="item-din" style="grid-template-columns:auto 1fr auto">
        <span class="n">${i+1}</span>
        <div class="lin" style="grid-template-columns:${cols}">
          ${campos.map(c => c.tipo === 'textarea'
            ? `<textarea rows="2" placeholder="${esc(c.ph)}" onchange="setServItem('${sid}','${col}',${i},'${c.k}',this.value)">${esc(it[c.k]||'')}</textarea>`
            : `<input type="${c.tipo||'text'}" ${c.tipo==='number'?'step="any"':''} placeholder="${esc(c.ph)}"
                 value="${esc(it[c.k]===0?'0':(it[c.k]||''))}"
                 onchange="setServItem('${sid}','${col}',${i},'${c.k}',this.value,${c.tipo==='number'})"/>`).join('')}
        </div>
        <button class="quitar" onclick="quitarServItem('${sid}','${col}',${i})">&times;</button>
      </div>`).join('')}
    <div><button class="btn mini" onclick="agregarServItem('${sid}','${col}')">+ ${esc(etiqueta)}</button></div>
  </div>`;
}
